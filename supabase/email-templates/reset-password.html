<!-- Supabase > Authentication > Emails > Templates > "Reset password". Subject: Reset your TripMate password -->
<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#F6F7F9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F7F9;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px 28px;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2a2a;">
        <tr><td align="center" style="padding-bottom:20px;">
          <img src="https://tripmate-app.expo.app/logo192.png" width="64" height="64" alt="TripMate"
               style="display:block;border-radius:14px;">
        </td></tr>
        <tr><td style="font-size:22px;font-weight:700;color:#0B3B5B;padding-bottom:12px;text-align:center;">
          Reset your password
        </td></tr>
        <tr><td style="font-size:16px;line-height:1.5;padding-bottom:24px;text-align:center;">
          Someone asked to reset the password for <strong>{{ .Email }}</strong>. Tap the button to choose a new one.
        </td></tr>
        <tr><td align="center" style="padding-bottom:24px;">
          <a href="{{ .ConfirmationURL }}"
             style="display:inline-block;background:#0B7A75;color:#ffffff;text-decoration:none;font-size:16px;
                    font-weight:600;padding:14px 28px;border-radius:12px;">Choose a new password</a>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.5;color:#666;text-align:center;">
          If you didn’t ask for this, you can ignore this email. Your password stays the same.<br>
          Questions? <a href="mailto:info@tripmatesupport.com" style="color:#0B5CAD;">info@tripmatesupport.com</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
